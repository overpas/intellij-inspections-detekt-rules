intellij-kotlin-coroutines:
  active: true
  CoroutineContextWithJob:
    active: true
  DeferredResultUnused:
    active: true
  ForEachJoinOnCollectionOfJob:
    active: true
  MapAwaitOnCollectionOfDeferred:
    active: true
  PreferCurrentCoroutineContextToCoroutineContext:
    active: true
  RunBlockingInSuspendFunction:
    active: true
  SimplifiableFlowCall:
    active: true
  SimplifiableFlowCallChain:
    active: true
  SuspendCoroutineLacksCancellationGuarantees:
    active: true
  SuspiciousImplicitCoroutineScopeReceiverAccess:
    active: true
  SuspiciousMutableCollectionInStateFlow:
    active: true
  UnusedFlow:
    active: true
    ignoredLambdaFunctions:
      - 'io.mockk.verify'
      - 'io.mockk.coVerify'
      - 'io.mockk.verifyAll'
      - 'io.mockk.coVerifyAll'
      - 'io.mockk.verifyOrder'
      - 'io.mockk.coVerifyOrder'
      - 'io.mockk.verifySequence'
      - 'io.mockk.coVerifySequence'
      - 'io.mockk.excludeRecords'
  UselessCallOnFlow:
    active: true
